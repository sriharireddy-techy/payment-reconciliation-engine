[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    oracle: needs a real Oracle connection (.env) and RUN_ORACLE_INTEGRATION=1; writes clearly labelled test rows
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx` with `starlette.testclient` is deprecated
